name: Stepcode ARM64 (upstream build)
on:
  workflow_dispatch:
    inputs:
      runner_diagnostics:
        description: 'Only run macOS Runner A/B checks without publishing'
        type: boolean
        default: false
  schedule:
    - cron: '23 3 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/apply-zcode.py'
      - 'scripts/verify-stepcode-patch.py'
      - 'scripts/update-homebrew-formula.py'
      - 'release-revisions.json'
      - '.github/workflows/zcode-arm64.yml'
permissions:
  contents: write
  actions: write
concurrency:
  group: ${{ ((github.event_name == 'workflow_dispatch' && inputs.runner_diagnostics == true) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[runner-ab]'))) && 'stepcode-runner-ab' || 'stepcode-arm64-publish' }}
  cancel-in-progress: false
  queue: max
jobs:
  runner_ab:
    name: Runner A/B (${{ matrix.runner }})
    if: ${{ github.repository == 'Zereker/stepcode' && ((github.event_name == 'workflow_dispatch' && inputs.runner_diagnostics == true) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[runner-ab]'))) }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-26]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - name: Report runner allocation
        run: |
          set -euo pipefail
          echo "Runner: $RUNNER_NAME"
          uname -m
          sw_vers
          xcodebuild -version
          {
            echo "## Runner A/B ${{ matrix.runner }}"
            echo "Assigned runner: $RUNNER_NAME"
            echo "Architecture: $(uname -m)"
            echo "macOS: $(sw_vers -productVersion)"
            echo "Xcode: $(xcodebuild -version | head -n 1)"
          } >> "$GITHUB_STEP_SUMMARY"

  runner_preflight:
    name: Record macOS runner scheduling diagnostics
    if: ${{ github.repository == 'Zereker/stepcode' && !(github.event_name == 'workflow_dispatch' && inputs.runner_diagnostics == true) && !(github.event_name == 'push' && contains(github.event.head_commit.message, '[runner-ab]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record runner requirements and workflow run
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "## macOS runner scheduling preflight"
            echo "Requested runner: macos-15 (GitHub-hosted; Apple Silicon build)"
            echo "Run: $RUN_URL"
            echo "Attempt: $GITHUB_RUN_ATTEMPT"
            echo "This Ubuntu preflight cannot guarantee macOS runner capacity."
            echo "If build is cancelled with runner_id=0 and no steps, investigate runner allocation, billing and GitHub Actions platform availability."
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: runner_preflight
    if: ${{ needs.runner_preflight.result == 'success' }}
    runs-on: macos-15
    timeout-minutes: 360
    env:
      CARGO_BUILD_JOBS: '2'
      # Use system Git for Cargo Git dependencies (including V8 submodules).
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - name: Checkout Stepcode build recipes
        uses: actions/checkout@v4
        with:
          path: stepcode-build
          persist-credentials: false
      - name: Resolve latest official stable Codex Release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # GitHub's /releases/latest excludes drafts and prereleases.
          tag="$(gh api repos/openai/codex/releases/latest --jq .tag_name)"
          test -n "$tag"
          echo "UPSTREAM_TAG=$tag" >> "$GITHUB_ENV"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          revision="$(python3 -c 'import json,sys; print(json.load(open("stepcode-build/release-revisions.json")).get(sys.argv[1], 0))' "$tag")"
          case "$revision" in ''|*[!0-9]*) echo "Invalid revision" >&2; exit 1;; esac
          suffix=""
          if [ "$revision" -gt 0 ]; then suffix="-r$revision"; fi
          echo "STEPCODE_REVISION=$revision" >> "$GITHUB_ENV"
          echo "STEPCODE_SUFFIX=$suffix" >> "$GITHUB_ENV"
          if gh release view "stepcode-$tag$suffix" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "build_needed=false" >> "$GITHUB_OUTPUT"
            echo "Stepcode for stable Codex release $tag already exists." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "build_needed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout official stable Codex release
        uses: actions/checkout@v4
        with:
          repository: openai/codex
          ref: ${{ steps.check.outputs.tag }}
          path: codex-upstream
          persist-credentials: false
      - name: Apply minimal fail-closed identity patch
        run: python3 stepcode-build/scripts/apply-zcode.py codex-upstream
      - name: Verify Stepcode P0 isolation patch
        run: python3 stepcode-build/scripts/verify-stepcode-patch.py codex-upstream
      - name: Confirm Apple Silicon runner
        if: steps.check.outputs.build_needed == 'true'
        run: |
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
      - name: Install protobuf
        if: steps.check.outputs.build_needed == 'true'
        run: brew install protobuf ripgrep
      - name: Cache Cargo downloads
        if: steps.check.outputs.build_needed == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: stepcode-cargo-${{ runner.os }}-${{ hashFiles('codex-upstream/codex-rs/Cargo.lock') }}
          restore-keys: |
            stepcode-cargo-${{ runner.os }}-
      - name: Resolve stable release lockfile and record changes
        if: steps.check.outputs.build_needed == 'true'
        working-directory: codex-upstream/codex-rs
        run: |
          set -euo pipefail
          # Keep all versions already pinned by the official release where possible.
          # Cargo minimally reconciles any stale lock metadata before --locked builds.
          cp Cargo.lock "$RUNNER_TEMP/Cargo.lock.upstream"
          cargo metadata --format-version 1 > "$RUNNER_TEMP/stepcode-cargo-metadata.json"
          git diff -- Cargo.lock > "$RUNNER_TEMP/stepcode-Cargo.lock.patch"
          shasum -a 256 Cargo.lock > "$RUNNER_TEMP/stepcode-Cargo.lock.sha256"
          if [ -s "$RUNNER_TEMP/stepcode-Cargo.lock.patch" ]; then
            echo "Stable release Cargo.lock required reconciliation:" >> "$GITHUB_STEP_SUMMARY"
            git diff --stat -- Cargo.lock >> "$GITHUB_STEP_SUMMARY"
          fi
          cargo metadata --locked --format-version 1 > /dev/null
      - name: Upload reconciled lockfile for reproducibility
        if: steps.check.outputs.build_needed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: stepcode-lockfile-${{ env.UPSTREAM_TAG }}
          path: |
            codex-upstream/codex-rs/Cargo.lock
            ${{ runner.temp }}/stepcode-Cargo.lock.patch
            ${{ runner.temp }}/stepcode-Cargo.lock.sha256
          if-no-files-found: error
      - name: Fetch verified official Codex V8 sandbox build
        if: steps.check.outputs.build_needed == 'true'
        working-directory: codex-upstream
        run: |
          set -euo pipefail
          version="$(python3 - <<'PY'
          import tomllib
          with open('codex-rs/Cargo.lock', 'rb') as f:
              packages = tomllib.load(f)['package']
          versions = {p['version'] for p in packages if p['name'] == 'v8'}
          if len(versions) != 1:
              raise SystemExit(f'Expected exactly one v8 version, found {versions}')
          print(versions.pop())
          PY
          )"
          target="aarch64-apple-darwin"
          stem="ptrcomp_sandbox_release_${target}"
          archive="librusty_v8_${stem}.a.gz"
          binding="src_binding_${stem}.rs"
          checksums="rusty_v8_${stem}.sha256"
          base="https://github.com/openai/codex/releases/download/rusty-v8-v${version}"
          dir="${RUNNER_TEMP}/rusty-v8"
          mkdir -p "$dir"
          trusted="third_party/v8/rusty_v8_${version//./_}_release_manifests.sha256"
          test -f "$trusted"
          curl -fsSL --retry 3 "$base/$checksums" -o "$dir/$checksums"
          expected="$(awk -v file="$checksums" '$2 == file {print $1}' "$trusted")"
          test -n "$expected"
          actual="$(shasum -a 256 "$dir/$checksums" | awk '{print $1}')"
          test "$actual" = "$expected"
          curl -fsSL --retry 3 "$base/$archive" -o "$dir/$archive"
          curl -fsSL --retry 3 "$base/$binding" -o "$dir/$binding"
          test "$(wc -l < "$dir/$checksums" | tr -d ' ')" = 2
          (cd "$dir" && tr -d '\r' < "$checksums" | shasum -a 256 -c -)
          echo "RUSTY_V8_ARCHIVE=$dir/$archive" >> "$GITHUB_ENV"
          echo "RUSTY_V8_SRC_BINDING_PATH=$dir/$binding" >> "$GITHUB_ENV"
      - name: Test Stepcode home resolution
        if: steps.check.outputs.build_needed == 'true'
        working-directory: codex-upstream/codex-rs
        run: cargo test --locked -p codex-utils-home-dir
      - name: Compile upstream as Stepcode
        if: steps.check.outputs.build_needed == 'true'
        working-directory: codex-upstream/codex-rs
        env:
          OTEL_SDK_DISABLED: 'true'
        run: cargo build --locked --release --target aarch64-apple-darwin -p codex-cli --bin stepcode -p codex-code-mode-host --bin codex-code-mode-host
      - name: Smoke test main executable
        if: steps.check.outputs.build_needed == 'true'
        run: |
          set -euo pipefail
          bin="codex-upstream/codex-rs/target/aarch64-apple-darwin/release/stepcode"
          file "$bin" | grep -q 'Mach-O 64-bit executable arm64'
          "$bin" --help | grep -q stepcode
          "$bin" --version
          mkdir -p "$RUNNER_TEMP/stepcode-home"
          STEPCODE_HOME="$RUNNER_TEMP/stepcode-home" "$bin" --help >/dev/null
          helper="codex-upstream/codex-rs/target/aarch64-apple-darwin/release/codex-code-mode-host"
          file "$helper" | grep -q 'Mach-O 64-bit executable arm64'
      - name: Determine official revision
        if: steps.check.outputs.build_needed == 'true'
        run: |
          echo "UPSTREAM_SHA=$(git -C codex-upstream rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Package and checksum
        if: steps.check.outputs.build_needed == 'true'
        run: |
          set -euo pipefail
          mkdir -p dist/bin dist/codex-path
          cp codex-upstream/codex-rs/target/aarch64-apple-darwin/release/stepcode dist/bin/stepcode
          cp codex-upstream/codex-rs/target/aarch64-apple-darwin/release/codex-code-mode-host dist/bin/codex-code-mode-host
          cp "$(command -v rg)" dist/codex-path/rg
          chmod +x dist/bin/stepcode dist/bin/codex-code-mode-host dist/codex-path/rg
          python3 - <<'PY'
          import json
          from pathlib import Path
          Path("dist/codex-package.json").write_text(json.dumps({
              "layoutVersion": 2,
              "version": "0.0.0",
              "target": "aarch64-apple-darwin",
              "entrypoint": "bin/stepcode",
              "resourcesDir": "codex-resources",
              "pathDir": "codex-path",
          }, indent=2) + "\n")
          PY
          printf 'upstream=%s\nstepcode_build=%s\nrevision=%s\n' "$UPSTREAM_SHA" "$GITHUB_SHA" "$STEPCODE_REVISION" > dist/REVISION.txt
          tar -czf "stepcode-macos-arm64-${UPSTREAM_TAG}${STEPCODE_SUFFIX}.tar.gz" -C dist bin codex-path codex-package.json REVISION.txt
          shasum -a 256 "stepcode-macos-arm64-${UPSTREAM_TAG}${STEPCODE_SUFFIX}.tar.gz" > "stepcode-macos-arm64-${UPSTREAM_TAG}${STEPCODE_SUFFIX}.tar.gz.sha256"
      - name: Upload tested candidate
        if: steps.check.outputs.build_needed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: stepcode-macos-arm64-${{ env.UPSTREAM_TAG }}-r${{ env.STEPCODE_REVISION }}
          path: |
            stepcode-macos-arm64-*.tar.gz
            stepcode-macos-arm64-*.sha256
          if-no-files-found: error
      - name: Verify release still targets current Stepcode recipe
        if: steps.check.outputs.build_needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          if [ "$current" != "$GITHUB_SHA" ]; then
            echo "Build recipe changed during compile: refusing stale release" >&2
            exit 1
          fi
      - name: Verify packaged CLI and daemon
        if: steps.check.outputs.build_needed == 'true'
        run: |
          set -euo pipefail
          test -f dist/codex-package.json
          test -x dist/bin/stepcode
          test -x dist/bin/codex-code-mode-host
          test -x dist/codex-path/rg
          python3 - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path("dist/codex-package.json").read_text())
          assert d["entrypoint"] == "bin/stepcode"
          assert d["target"] == "aarch64-apple-darwin"
          PY
          isolated="$(mktemp -d)"
          trap 'rm -rf "$isolated"' EXIT
          STEPCODE_HOME="$isolated/home" dist/bin/stepcode --version
          mkdir -p "$isolated/home"
          # Doctor checks runner-specific authentication/network/terminal state;
          # it returns 1 for any failed diagnostic, not necessarily a broken package.
          # Record its complete output without masking package/daemon smoke failures.
          if STEPCODE_HOME="$isolated/home" dist/bin/stepcode doctor --summary > "$RUNNER_TEMP/stepcode-doctor.txt" 2>&1; then
            echo "Doctor diagnostics passed."
          else
            echo "::warning::Doctor reported runner-environment failures; see diagnostics below."
          fi
          cat "$RUNNER_TEMP/stepcode-doctor.txt"
          # Test fresh managed daemon bootstrap using the packaged binary,
          # not only the bare executable; do not affect any existing Codex state.
          STEPCODE_HOME="$isolated/home" dist/bin/stepcode app-server daemon start > "$RUNNER_TEMP/stepcode-daemon.json"
          STEPCODE_HOME="$isolated/home" dist/bin/stepcode app-server daemon version
          STEPCODE_HOME="$isolated/home" dist/bin/stepcode app-server daemon stop
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p=json.loads(Path(os.environ["RUNNER_TEMP"],"stepcode-daemon.json").read_text())
          assert "/.stepcode/" not in p["socketPath"] or "stepcode" in p["socketPath"]
          assert "stepcode" in p["managedCodexPath"]
          PY
      - name: Publish Stepcode release
        if: steps.check.outputs.build_needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="stepcode-${UPSTREAM_TAG}${STEPCODE_SUFFIX}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Already published $tag"
            exit 0
          fi
          gh release create "$tag" \
            "stepcode-macos-arm64-${UPSTREAM_TAG}${STEPCODE_SUFFIX}.tar.gz" \
            "stepcode-macos-arm64-${UPSTREAM_TAG}${STEPCODE_SUFFIX}.tar.gz.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Stepcode ARM64 (${UPSTREAM_TAG}${STEPCODE_SUFFIX})" \
            --notes "Built from official openai/codex commit $UPSTREAM_SHA with the small Stepcode identity patch. Telemetry and full isolation requirements have NOT been certified. No AgentD modifications."

      - name: Generate Homebrew formula from verified release
        if: steps.check.outputs.build_needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="stepcode-${UPSTREAM_TAG}${STEPCODE_SUFFIX}"
          filename="stepcode-macos-arm64-${UPSTREAM_TAG}${STEPCODE_SUFFIX}.tar.gz"
          digest="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq ".assets[] | select(.name == \"$filename\") | .digest")"
          test "${digest#sha256:}" != "$digest"
          sha="${digest#sha256:}"
          python3 stepcode-build/scripts/update-homebrew-formula.py --tag "$tag" --sha256 "$sha"
          ruby -c Formula/stepcode.rb
      - name: Check Homebrew formula before tap update
        if: steps.check.outputs.build_needed == 'true'
        run: |
          set -euo pipefail
          ruby -c Formula/stepcode.rb
          grep -F "version \"$(echo "$UPSTREAM_TAG" | sed 's/^rust-v//')\"" Formula/stepcode.rb
          if [ "$STEPCODE_REVISION" -gt 0 ]; then
            grep -F "revision $STEPCODE_REVISION" Formula/stepcode.rb
          fi
      - name: Upload Homebrew formula candidate
        if: steps.check.outputs.build_needed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: stepcode-homebrew-formula-${{ env.UPSTREAM_TAG }}-r${{ env.STEPCODE_REVISION }}
          path: Formula/stepcode.rb
          if-no-files-found: error
      - name: Update dedicated Homebrew Tap if configured
        if: steps.check.outputs.build_needed == 'true'
        env:
          GH_TOKEN: ${{ secrets.STEPCODE_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "STEPCODE_TAP_TOKEN missing; refusing to report complete release." >&2
            exit 1
          fi
          repo="Zereker/homebrew-tap"
          gh api "repos/$repo" >/dev/null
          content="$(python3 -c 'import base64; print(base64.b64encode(open("Formula/stepcode.rb","rb").read()).decode())')"
          sha="$(gh api "repos/$repo/contents/Formula/stepcode.rb" --jq .sha 2>/dev/null || true)"
          if [ -n "$sha" ]; then
            gh api -X PUT "repos/$repo/contents/Formula/stepcode.rb" -f message="Update Stepcode to ${UPSTREAM_TAG}" -f content="$content" -f sha="$sha" >/dev/null
          else
            gh api -X PUT "repos/$repo/contents/Formula/stepcode.rb" -f message="Add Stepcode ${UPSTREAM_TAG}" -f content="$content" >/dev/null
          fi

  notify:
    name: Report build failure or runner cancellation
    needs: [runner_preflight, build]
    if: ${{ always() && (needs.runner_preflight.result == 'failure' || needs.runner_preflight.result == 'cancelled' || needs.build.result == 'failure' || needs.build.result == 'cancelled') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Diagnose failed or cancelled build
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PREFLIGHT_RESULT: ${{ needs.runner_preflight.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          set -euo pipefail
          {
            echo "## Stepcode build did not complete successfully"
            echo
            echo "Run: $RUN_URL (attempt $GITHUB_RUN_ATTEMPT)"
            echo "Runner preflight: $PREFLIGHT_RESULT"
            echo "Build result: $BUILD_RESULT"
            echo
            echo "### GitHub job diagnostics"
          } >> "$GITHUB_STEP_SUMMARY"
          # Job metadata stays available even when a macOS runner was never assigned.
          if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" --jq '.jobs[] | "- \(.name): \(.conclusion // .status); runner_id=\(.runner_id // "null"); runner=\(.runner_name // ""); steps=\(.steps | length)"' >> "$GITHUB_STEP_SUMMARY"; then
            echo "GitHub jobs API query succeeded." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Unable to fetch job metadata; inspect the Actions run directly." >> "$GITHUB_STEP_SUMMARY"
          fi
          {
            echo
            echo "A cancelled job with runner_id=0 and zero steps was not assigned a runner; it is not evidence of a Rust build error."
            echo "An entire workflow cancellation may prevent this notification job from starting."
          } >> "$GITHUB_STEP_SUMMARY"
